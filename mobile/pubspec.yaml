name: lyricdisplay_mobile
description: "Selah mobile controller — discover, pair, and drive the show from a phone or tablet."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  socket_io_client: ^3.1.2
  http: ^1.5.0
  dio: ^5.11.0
  bonsoir: ^5.1.11
  multicast_dns: ^0.3.3+1
  network_info_plus: ^8.2.1
  mobile_scanner: ^7.4.0
  uuid: ^4.6.0
  flutter_secure_storage: ^11.0.0
  go_router: ^14.6.2
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
