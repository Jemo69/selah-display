name: Mobile Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks
          cat > android/keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test

      - name: Resolve version
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Warn on debug signing
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo '::warning::No KEYSTORE secrets — release artifacts will carry DEBUG signing. Sideload-only; do not upload the AAB to Play.'

      - name: Build release APK (sideload)
        run: flutter build apk --release

      - name: Build app bundle (Play Store)
        run: flutter build appbundle --release

      - name: Rename artifacts with version
        run: |
          VER='${{ steps.version.outputs.name }}'
          cp build/app/outputs/flutter-apk/app-release.apk "selah-mobile-${VER}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "selah-mobile-${VER}.aab"
          ls -la selah-mobile-*

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/selah-mobile-*.apk
            mobile/selah-mobile-*.aab
